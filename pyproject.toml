[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-forge"
version = "0.1.0"
description = "Cross-framework compliance gap assessment (NIS2, GDPR, ISO 27001) with prioritized remediation roadmap"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
compliance-forge = "compliance_forge.cli:main"

[tool.setuptools]
packages = ["compliance_forge"]
